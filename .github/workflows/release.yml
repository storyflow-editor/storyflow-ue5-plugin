name: Release

on:
  release:
    types: [published]

env:
  # Platforms baked into every zip. Set to "Win64+Linux" ONLY after the runner
  # has (a) Linux Target Support installed for every engine version below and
  # (b) Epic's Linux cross-compile toolchain installed (LINUX_MULTIARCH_ROOT
  # set machine-wide). The precheck step fails the release loudly if Linux is
  # requested without them - silently shipping Win64-only zips would recreate
  # the "Linux download does not work" support case through a different door.
  TARGET_PLATFORMS: Win64

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Remove stale AutomationTool script module records
        shell: powershell
        run: |
          # AutomationTool loads ALL ScriptModule JSON records from Engine/Intermediate/ScriptModules
          # before any command runs. For Installed Builds, it sets NoCompile + ErrorOnMissingTarget,
          # meaning a missing DLL (e.g. Android.Automation.dll when Android support isn't installed)
          # causes a fatal exception. The JSON records ship for ALL platforms regardless of what was
          # installed. Fix: remove any JSON record whose TargetPath DLL doesn't exist on disk.
          # See: CompileScriptModules.cs Build() method, lines ~317-356 in UE source.
          $engines = "C:\Program Files\Epic Games"
          foreach ($ue in @("5.3", "5.4", "5.5", "5.6", "5.7", "5.8")) {
            $dir = "$engines\UE_$ue\Engine\Intermediate\ScriptModules"
            if (!(Test-Path $dir)) { continue }
            Get-ChildItem "$dir\*.json" | ForEach-Object {
              try {
                $data = Get-Content $_.FullName -Raw | ConvertFrom-Json
                if ($data.TargetPath) {
                  # TargetPath is relative to the .csproj's directory (ProjectPath is relative to the JSON)
                  $projectDir = Split-Path (Join-Path $_.DirectoryName $data.ProjectPath) -Parent
                  $dllPath = Join-Path $projectDir $data.TargetPath | Resolve-Path -ErrorAction SilentlyContinue
                  if (!$dllPath) {
                    Remove-Item $_.FullName -Force
                    Write-Host "Removed stale record: UE $ue / $($_.Name)"
                  }
                }
              } catch {}
            }
          }

      - name: Configure build executor
        shell: powershell
        run: |
          $cfgDir = "$env:APPDATA\Unreal Engine\UnrealBuildTool"
          $cfg = Join-Path $cfgDir "BuildConfiguration.xml"
          $bak = Join-Path $cfgDir "BuildConfiguration.ci-backup.xml"
          New-Item -ItemType Directory -Force -Path $cfgDir | Out-Null
          if (Test-Path $cfg) { Copy-Item $cfg $bak -Force }
          Set-Content -Path $cfg -Encoding utf8 -Value @(
            '<?xml version="1.0" encoding="utf-8" ?>',
            '<Configuration xmlns="https://www.unrealengine.com/BuildConfiguration">',
            '  <BuildConfiguration>',
            '    <bAllowUBAExecutor>false</bAllowUBAExecutor>',
            '  </BuildConfiguration>',
            '</Configuration>'
          )

      - name: Verify Linux cross-compile prerequisites
        if: contains(env.TARGET_PLATFORMS, 'Linux')
        shell: powershell
        run: |
          # Loud failure beats silently shipping zips without the promised
          # Linux binaries. Different engine versions may require different
          # toolchain releases; if that bites, override LINUX_MULTIARCH_ROOT
          # per iteration in the build step's loop instead of machine-wide.
          $failed = $false
          $toolchain = [Environment]::GetEnvironmentVariable("LINUX_MULTIARCH_ROOT", "Machine")
          if (-not $toolchain -or -not (Test-Path $toolchain)) {
            Write-Host "::error::LINUX_MULTIARCH_ROOT is not set or missing on this runner. Install Epic's Linux cross-compile toolchain."
            $failed = $true
          }
          foreach ($ue in @("5.3", "5.4", "5.5", "5.6", "5.7", "5.8")) {
            if (!(Test-Path "C:\Program Files\Epic Games\UE_$ue\Engine\Binaries\Linux")) {
              Write-Host "::error::UE $ue has no Linux Target Support installed (Epic launcher > engine options)."
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Build plugin for all UE versions
        shell: cmd
        run: |
          set PLUGIN=%GITHUB_WORKSPACE%\StoryFlowPlugin.uplugin
          set OUTPUT=%GITHUB_WORKSPACE%\BuildOutput
          set ENGINES=C:\Program Files\Epic Games

          for %%V in (5.3 5.4 5.5 5.6 5.7 5.8) do (
            echo Building for UE %%V targeting %TARGET_PLATFORMS%...
            if exist "%OUTPUT%\StoryFlowPlugin_%%V" rmdir /s /q "%OUTPUT%\StoryFlowPlugin_%%V"
            call "%ENGINES%\UE_%%V\Engine\Build\BatchFiles\RunUAT.bat" BuildPlugin -Plugin="%PLUGIN%" -Package="%OUTPUT%\StoryFlowPlugin_%%V" -TargetPlatforms=%TARGET_PLATFORMS% -Rocket
            if errorlevel 1 (
              echo [FAILED] UE %%V build failed!
              exit /b 1
            )
            echo [OK] UE %%V build succeeded.
          )

      - name: Restore build executor setting
        if: always()
        shell: powershell
        run: |
          $cfgDir = "$env:APPDATA\Unreal Engine\UnrealBuildTool"
          $cfg = Join-Path $cfgDir "BuildConfiguration.xml"
          $bak = Join-Path $cfgDir "BuildConfiguration.ci-backup.xml"
          if (Test-Path $bak) { Move-Item $bak $cfg -Force } else { Remove-Item $cfg -Force -ErrorAction SilentlyContinue }

      - name: Zip builds
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          foreach ($ue in @("5.3", "5.4", "5.5", "5.6", "5.7", "5.8")) {
            $src = "BuildOutput\StoryFlowPlugin_$ue"
            $zip = "StoryFlow-Plugin-v$version-UE$ue.zip"
            if (Test-Path $src) {
              # Rename folder to StoryFlowPlugin so users get a clean folder on extract
              $pkg = "BuildOutput\StoryFlowPlugin"
              if (Test-Path $pkg) { Remove-Item $pkg -Recurse -Force }
              Rename-Item $src "StoryFlowPlugin"
              # tar.exe (bundled with Windows 10 1803+ / Server 2019+) writes forward-slash
              # zip entries; PowerShell's Compress-Archive writes backslashes that break
              # extraction on Linux/Mac. -C strips the BuildOutput/ prefix from the entries.
              tar.exe -a -c -f $zip -C "BuildOutput" "StoryFlowPlugin"
              if ($LASTEXITCODE -ne 0) { Write-Host "tar failed for UE $ue"; exit 1 }
              Rename-Item $pkg "StoryFlowPlugin_$ue"
              # Guard against separator regressions regardless of which tool
              # made the archive: a single backslash entry breaks extraction
              # on Linux/Mac (files get literal backslashes in their names and
              # the .uplugin is never found).
              $entries = tar.exe -t -f $zip
              if ($LASTEXITCODE -ne 0) { Write-Host "Cannot list $zip"; exit 1 }
              if ($entries | Where-Object { $_ -match '\\' }) {
                Write-Host "::error::$zip contains backslash path entries; it would extract broken on Linux/Mac."
                exit 1
              }
              if (-not ($entries -contains "StoryFlowPlugin/StoryFlowPlugin.uplugin")) {
                Write-Host "::error::$zip is missing StoryFlowPlugin/StoryFlowPlugin.uplugin at the expected path."
                exit 1
              }
              Write-Host "Created and verified $zip"
            } else {
              Write-Host "WARNING: $src not found, skipping"
              exit 1
            }
          }

      - name: Upload to R2
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          foreach ($ue in @("5.3", "5.4", "5.5", "5.6", "5.7", "5.8")) {
            $zip = "StoryFlow-Plugin-v$version-UE$ue.zip"
            aws s3 cp $zip "s3://${{ secrets.R2_BUCKET_NAME }}/ue5/$version/$zip" --endpoint-url "https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com"
          }
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Attach to GitHub Release
        shell: powershell
        run: |
          $version = "${{ steps.version.outputs.version }}"
          foreach ($ue in @("5.3", "5.4", "5.5", "5.6", "5.7", "5.8")) {
            gh release upload ${{ github.ref_name }} "StoryFlow-Plugin-v$version-UE$ue.zip" --clobber
          }
        env:
          GH_TOKEN: ${{ github.token }}

  verify-linux-extraction:
    # A real Linux unzip of a real release asset: the test that was missing
    # when backslash-entry zips shipped and failed to load for Linux users.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download one release zip and extract it the way a user would
        run: |
          gh release download ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --pattern "*-UE5.3.zip" \
            --dir .
          ZIP=$(ls *-UE5.3.zip)
          unzip -q "$ZIP" -d extracted
          if [ ! -f "extracted/StoryFlowPlugin/StoryFlowPlugin.uplugin" ]; then
            echo "::error::$ZIP did not extract to StoryFlowPlugin/StoryFlowPlugin.uplugin on Linux."
            echo "Extracted tree:"
            find extracted -maxdepth 3 | head -50
            exit 1
          fi
          echo "OK: $ZIP extracts correctly on Linux."
        env:
          GH_TOKEN: ${{ github.token }}

  changelog:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Open changelog PR on storyflow-web
        run: |
          CHANGELOG_FILE="changelogs/v${{ steps.version.outputs.version }}.md"
          if [ ! -f "$CHANGELOG_FILE" ]; then
            echo "No changelog file found at $CHANGELOG_FILE, skipping"
            exit 0
          fi

          VERSION=${{ steps.version.outputs.version }}
          BRANCH="changelog/unreal-v${VERSION}"
          DEST_PATH="src/content/changelog-unreal/v${VERSION}.md"

          cd /tmp
          git clone --depth 1 --branch live \
            https://x-access-token:${{ secrets.WEB_REPO_PAT }}@github.com/storyflow-editor/storyflow-web.git
          cd storyflow-web

          git push origin --delete "$BRANCH" 2>/dev/null || true
          git checkout -b "$BRANCH"
          cp $GITHUB_WORKSPACE/$CHANGELOG_FILE $DEST_PATH
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add $DEST_PATH
          git commit -m "Add changelog: Unreal v${VERSION}"
          git push -u origin "$BRANCH"

          gh pr create \
            --repo storyflow-editor/storyflow-web \
            --base live \
            --head "$BRANCH" \
            --title "Add changelog: Unreal v${VERSION}" \
            --body "Auto-generated from Unreal plugin release v${VERSION}. Merge to deploy."
        env:
          GH_TOKEN: ${{ secrets.WEB_REPO_PAT }}

  bump-version:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version
        run: |
          CURRENT=$(node -p "JSON.parse(require('fs').readFileSync('StoryFlowPlugin.uplugin','utf8')).VersionName")
          IFS='.' read -r major minor patch <<< "$CURRENT"
          NEW="$major.$minor.$((patch + 1))"
          echo "$NEW" | node update-version.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bump version to $(node -p "JSON.parse(require('fs').readFileSync('StoryFlowPlugin.uplugin','utf8')).VersionName")"
          git push
